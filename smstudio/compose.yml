version: '3.9'

services:
  web:
    build: .
    image: smstudio
    container_name: smstudio
    restart: always
    command: "python manage.py runserver 0.0.0.0:8001"
    links:
      - db 
    volumes:
      - ./smstudio:/app/www/smstudio
    ports:
      - "8001:8000"
    environment:
      - DEBUG=1
      - DB_HOST=db
      - DB_NAME=${DATABASE_NAME}
      - DB_USER=${DATABASE_USER}
      - DB_PASSWORD=${DATABASE_PASSWORD}
      - DB_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD}
      - DB_PORT=${DATABASE_PORT}
    depends_on:
      - db
    networks:
      - app_network

  # adminer:
  #   image: adminer
  #   container_name: adminer
  #   ports:
  #     - "8080:8080"
  #   links:
  #     - db
  #   networks:
  #     - app_network
  #   depends_on:
  #     - db

  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge